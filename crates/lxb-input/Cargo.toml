[package]
name = "lxb-input"
description = "The LineXinBar interaction language, read from real devices: a controller, a keyboard and a pointer as one interface"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lxb-toolkit = { path = "../lxb-toolkit", version = "0.9.0" }

gilrs = "0.11.2"

winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "x11",
], optional = true }

[features]
default = []
winit = ["dep:winit"]
