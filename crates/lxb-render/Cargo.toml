[package]
name = "lxb-render"
description = "The LineXinBar design language, drawn: one call per thing, in the shell's own material"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lxb-toolkit = { path = "../lxb-toolkit", version = "0.9.1" }
# How a file question is put to the desktop. Std only — no window, no GPU, no
# runtime — so a component that draws a chooser can also decline to draw one.
lxb-portal = { path = "../lxb-portal", version = "0.9.1" }

# One clock reading: the monotonic sample a wallpaper handoff is anchored to.
# `lxb-toolkit` owns the record itself and links nothing but its catalogs, so
# the one call that needs the C library is made from the crate every program
# drawing the wallpaper already has.
libc = "0.2"

bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
wgpu = "30"
# The keyboard layout this machine is configured for, so the picker's on-screen
# board prints the letters the person in front of it actually types rather than
# American ones. Reading a keymap is all it is used for; nothing here holds a
# seat. See `picker_keyboard_note_layout` in `src/components.rs`.
xkbcommon = "0.8"
