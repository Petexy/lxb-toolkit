[package]
name = "lxb-sound"
description = "The LineXinBar interface sounds, played: the shipped recordings, the rests between them, and the machine's output"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lxb-toolkit = { path = "../lxb-toolkit", version = "0.9.1" }

rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "vorbis",
] }
