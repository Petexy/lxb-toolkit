    <rect id="back" x="4.0" y="10.0" width="24.0" height="14.6" rx="2.2"/>
    <rect id="pocket" x="4.0" y="12.6" width="24.0" height="12.0" rx="2.2"/>
    <path id="cross" d="M14.85 14.55h2.3v2.75h2.75v2.3h-2.75v2.75h-2.3v-2.75
