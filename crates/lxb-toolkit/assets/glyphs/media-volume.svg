<svg data-lxb-material="lxb:shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="stem" x="15.6" y="5.0" width="2.4" height="17.8" rx="1.2"/>
    <ellipse id="head" cx="13.0" cy="23.0" rx="4.7" ry="3.7" transform="rotate(-20 13 23)"/>
    <path id="flag" d="M16.8 5.4C20.9 7.2 23.1 9.6 22.6 13.6" fill="none"
          stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <g id="bead"><use href="#stem"/><use href="#head"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#flag"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
    <use href="#flag"/>
  </g>
</svg>
