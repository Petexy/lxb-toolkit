<svg data-lxb-material="lxb:shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="plate" x="2.4" y="9.6" width="27.2" height="12.8" rx="2.4"/>
    <rect id="well" x="4.6" y="11.8" width="22.8" height="8.4" rx="1.4"/>
    <g id="typed">
      <rect x="6.5" y="14.5" width="2.9" height="3" rx="1.2"/>
      <rect x="10.2" y="14.5" width="3.6" height="3" rx="1.2"/>
      <rect x="14.6" y="14.5" width="2.3" height="3" rx="1.15"/>
      <rect x="19" y="12.8" width="1.7" height="6.4" rx="0.7"/>
    </g>
    <g id="bead"><use href="#plate"/><use href="#typed"/></g>
    <g id="holes"><use href="#well"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
      <use href="#typed" fill="#ffffff"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.963) translate(-16 -16)">

    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
