<svg data-lxb-material="lxb:shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <circle id="bulb" cx="4.8" cy="16" r="4.0"/>
    <path id="handle" d="M4.8 13.6 L14.0 11.4 L14.0 20.6 L4.8 18.4 Z"/>
    <rect id="ferrule" x="13.6" y="10.6" width="4.8" height="10.8" rx="1.0"/>
    <rect id="head" x="18.6" y="7.8" width="10.8" height="16.4" rx="1.8"/>
    <circle id="eye" cx="4.8" cy="16" r="1.8"/>
    <g id="bead">
      <use href="#bulb"/><use href="#handle"/><use href="#ferrule"/><use href="#head"/>
    </g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#eye" fill="#000000"/>
    </mask>
  </defs>

  <g transform="translate(16 16) scale(0.88) rotate(-45) translate(-16 -16)">
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
