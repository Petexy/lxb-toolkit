[workspace]
members = [
    "crates/lxb-toolkit",
    "crates/lxb-toolkit-ffi",
    "crates/lxb-new",
    "crates/lxb-render",
    "crates/lxb-portal",
    "crates/lxb-input",
    "crates/lxb-sound",
    "crates/lxb-app",
    "crates/lxb-app-ffi",
]

# The two forks in third_party/ are dependencies, not members: the workspace's
# lints, tests and formatting are about this toolkit's code, and a fork is
# carried to be built. They are LineXinBar's copies of GilRs, with its Linux
# hot-plug fix — see third_party/lxb-gilrs-core/README.LXB.md.
exclude = ["third_party/lxb-gilrs", "third_party/lxb-gilrs-core"]

# examples/rust is deliberately not a member. It is the greeting that draws the
# real material, so it carries winit, wgpu and glyphon — and a member that did
# would put a GPU stack into `cargo test --workspace`, into `cargo vendor` and
# therefore into every distribution package built from this tree. It is built
# on its own: see examples/README.md.
resolver = "2"

[workspace.package]
version = "0.9.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/petexy/lxb-toolkit"
authors = ["Piotr Lewandowski"]

[profile.release]
lto = true
strip = true
